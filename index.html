<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#214b3b" />
  <meta name="description" content="Moneta – lokale Finanzanalyse und Budgetplanung." />
  <script>
    try {
      const theme = localStorage.getItem('moneta-theme');
      if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch {}
  </script>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/views.css" />
  <title>Moneta</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/quick-capture.js"></script>
</body>
</html>
