name: Generate Moneta Android Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify required signing secrets
        env:
          STORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$STORE_PASSWORD" ] || { echo "MONETA_ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "MONETA_ANDROID_KEY_ALIAS is missing"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "MONETA_ANDROID_KEY_PASSWORD is missing"; exit 1; }
          if [ "$STORE_PASSWORD" = "Test" ] || [ "$KEY_PASSWORD" = "Test" ]; then
            echo "Replace placeholder passwords before generating the keystore."
            exit 1
          fi

      - name: Generate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signing-output
          keytool -genkeypair \
            -keystore signing-output/moneta-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Moneta, OU=Android, O=Moneta, L=Berlin, ST=Berlin, C=DE"

      - name: Verify generated keystore
        env:
          STORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore signing-output/moneta-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Create Base64 secret payload
        run: |
          set -euo pipefail
          base64 -w 0 signing-output/moneta-release.jks > signing-output/MONETA_ANDROID_KEYSTORE_BASE64.txt
          printf '\n' >> signing-output/MONETA_ANDROID_KEYSTORE_BASE64.txt
          cat > signing-output/README.txt <<'EOF'
          IMPORTANT: Keep moneta-release.jks permanently and back it up securely.

          1. Open MONETA_ANDROID_KEYSTORE_BASE64.txt.
          2. Copy its complete single-line value into the GitHub Actions repository secret:
             MONETA_ANDROID_KEYSTORE_BASE64
          3. Keep the existing password and alias secrets unchanged.
          4. Never commit the .jks file or the Base64 value to the repository.

          Future Moneta APKs must be signed with this exact keystore to remain update-compatible.
          EOF

      - name: Upload signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: moneta-android-signing-backup
          path: signing-output/
          if-no-files-found: error
          retention-days: 1
