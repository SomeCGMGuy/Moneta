name: Build Capacitor APK 2.6.3

on:
  workflow_dispatch:
  push:
    branches:
      - feat/capacitor-apk-2.6.3-test

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Apply Moneta launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          base="android/app/src/main/res"
          for spec in "mipmap-mdpi:48:108" "mipmap-hdpi:72:162" "mipmap-xhdpi:96:216" "mipmap-xxhdpi:144:324" "mipmap-xxxhdpi:192:432"; do
            IFS=: read -r folder launcher foreground <<< "$spec"
            mkdir -p "$base/$folder"
            rsvg-convert -w "$launcher" -h "$launcher" assets/icons/icon.svg -o "$base/$folder/ic_launcher.png"
            cp "$base/$folder/ic_launcher.png" "$base/$folder/ic_launcher_round.png"
            rsvg-convert -w "$foreground" -h "$foreground" assets/icons/icon.svg -o "$base/$folder/ic_launcher_foreground.png"
          done
          cat > "$base/values/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#214B3B</color></resources>
          EOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moneta-2.6.3-capacitor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
