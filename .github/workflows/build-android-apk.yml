name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Read app version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "package.json version must be numeric semantic versioning (x.y.z)" >&2
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=moneta-$APP_VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.app_version }}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Verify signing secrets
        env:
          MONETA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MONETA_ANDROID_KEYSTORE_BASE64 }}
          MONETA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          MONETA_ANDROID_KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          MONETA_ANDROID_KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$MONETA_ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: MONETA_ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$MONETA_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: MONETA_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$MONETA_ANDROID_KEY_ALIAS" || { echo "Missing secret: MONETA_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$MONETA_ANDROID_KEY_PASSWORD" || { echo "Missing secret: MONETA_ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore Android signing keystore
        env:
          MONETA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MONETA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/moneta-signing"
          printf '%s' "$MONETA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moneta-signing/moneta-release.jks"
          chmod 600 "$RUNNER_TEMP/moneta-signing/moneta-release.jks"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Add Android system UI protections
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one MainActivity.java, found {len(candidates)}')

          path = candidates[0]
          text = path.read_text(encoding='utf-8')
          package_match = re.search(r'^package\s+([^;]+);', text, re.MULTILINE)
          if not package_match:
              raise SystemExit('Could not determine MainActivity package')
          package_name = package_match.group(1)

          replacement = textwrap.dedent(f'''
          package {package_name};

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.annotation.Nullable;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends BridgeActivity {{
              private static final int BACKUP_SAVE_REQUEST = 27117;
              private View navigationBarProtection;
              private String pendingBackupContent;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getBridge().getWebView().setOverScrollMode(View.OVER_SCROLL_NEVER);
                  getBridge().getWebView().addJavascriptInterface(new BackupBridge(), "MonetaNative");

                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {{
                      getWindow().setNavigationBarContrastEnforced(false);
                  }}

                  WindowInsetsControllerCompat controller =
                          WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  controller.setAppearanceLightNavigationBars(false);

                  ViewGroup decor = (ViewGroup) getWindow().getDecorView();
                  navigationBarProtection = new View(this);
                  navigationBarProtection.setBackgroundColor(Color.BLACK);
                  navigationBarProtection.setImportantForAccessibility(View.IMPORTANT_FOR_ACCESSIBILITY_NO);
                  decor.addView(
                          navigationBarProtection,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  Gravity.BOTTOM
                          )
                  );

                  ViewCompat.setOnApplyWindowInsetsListener(decor, (view, insets) -> {{
                      int bottom = insets.getInsets(WindowInsetsCompat.Type.navigationBars()).bottom;
                      ViewGroup.LayoutParams params = navigationBarProtection.getLayoutParams();
                      if (params.height != bottom) {{
                          params.height = bottom;
                          navigationBarProtection.setLayoutParams(params);
                      }}
                      navigationBarProtection.setVisibility(bottom > 0 ? View.VISIBLE : View.GONE);
                      return insets;
                  }});
                  ViewCompat.requestApplyInsets(decor);
              }}

              private final class BackupBridge {{
                  @JavascriptInterface
                  public void saveBackup(String content, String fileName) {{
                      runOnUiThread(() -> {{
                          pendingBackupContent = content;
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          intent.putExtra(Intent.EXTRA_TITLE, fileName);
                          startActivityForResult(intent, BACKUP_SAVE_REQUEST);
                      }});
                  }}
              }}

              @Override
              protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {{
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != BACKUP_SAVE_REQUEST) return;
                  String content = pendingBackupContent;
                  pendingBackupContent = null;
                  if (resultCode != Activity.RESULT_OK || data == null || data.getData() == null || content == null) return;

                  Uri target = data.getData();
                  try (OutputStream stream = getContentResolver().openOutputStream(target, "w")) {{
                      if (stream == null) throw new IllegalStateException("No output stream available");
                      stream.write(content.getBytes(StandardCharsets.UTF_8));
                      stream.flush();
                      Toast.makeText(this, "Backup gespeichert.", Toast.LENGTH_SHORT).show();
                  }} catch (Exception error) {{
                      Toast.makeText(this, "Backup konnte nicht gespeichert werden.", Toast.LENGTH_LONG).show();
                  }}
              }}
          }}
          ''').lstrip()
          path.write_text(replacement, encoding='utf-8')
          PY

      - name: Configure Android release signing and version
        env:
          MONETA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/moneta-signing/moneta-release.jks
          MONETA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          MONETA_ANDROID_KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          MONETA_ANDROID_KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
          MONETA_APP_VERSION: ${{ steps.version.outputs.app_version }}
          MONETA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode 1', f'versionCode {os.environ["MONETA_VERSION_CODE"]}')
          text = text.replace('versionName "1.0"', f'versionName "{os.environ["MONETA_APP_VERSION"]}"')

          marker = '    buildTypes {'
          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("MONETA_ANDROID_KEYSTORE_PATH"))
                  storePassword System.getenv("MONETA_ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("MONETA_ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("MONETA_ANDROID_KEY_PASSWORD")
              }
          }\n'''
          if marker not in text:
              raise SystemExit('Could not locate buildTypes block in generated Android project')
          text = text.replace(marker, signing + marker, 1)

          release_marker = '        release {'
          if release_marker not in text:
              raise SystemExit('Could not locate release build type in generated Android project')
          text = text.replace(release_marker, release_marker + '\n            signingConfig signingConfigs.release', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Enable Android biometric permission
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.USE_BIOMETRIC" />'
          if permission not in text:
              manifest_start = text.find('<manifest')
              manifest_open_end = text.find('>', manifest_start) + 1
              text = text[:manifest_open_end] + '\n    ' + permission + text[manifest_open_end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Moneta launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          base="android/app/src/main/res"
          for spec in "mipmap-mdpi:48:108" "mipmap-hdpi:72:162" "mipmap-xhdpi:96:216" "mipmap-xxhdpi:144:324" "mipmap-xxxhdpi:192:432"; do
            IFS=: read -r folder launcher foreground <<< "$spec"
            mkdir -p "$base/$folder"
            rsvg-convert -w "$launcher" -h "$launcher" assets/icons/icon-android-launcher.svg -o "$base/$folder/ic_launcher.png"
            cp "$base/$folder/ic_launcher.png" "$base/$folder/ic_launcher_round.png"
            rsvg-convert -w "$foreground" -h "$foreground" assets/icons/icon-android-foreground.svg -o "$base/$folder/ic_launcher_foreground.png"
          done
          cat > "$base/values/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#214B3B</color></resources>
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          MONETA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/moneta-signing/moneta-release.jks
          MONETA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          MONETA_ANDROID_KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          MONETA_ANDROID_KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK file
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"

      - name: Upload test artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: moneta-${{ steps.version.outputs.app_version }}-signed-release
          path: ${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.apk_name }}" \
            --title "Moneta ${{ steps.version.outputs.app_version }}" \
            --generate-notes
