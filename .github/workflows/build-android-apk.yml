name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Read app version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "package.json version must be numeric semantic versioning (x.y.z)" >&2
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=moneta-$APP_VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.app_version }}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Verify signing secrets
        env:
          MONETA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MONETA_ANDROID_KEYSTORE_BASE64 }}
          MONETA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          MONETA_ANDROID_KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          MONETA_ANDROID_KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$MONETA_ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: MONETA_ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$MONETA_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: MONETA_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$MONETA_ANDROID_KEY_ALIAS" || { echo "Missing secret: MONETA_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$MONETA_ANDROID_KEY_PASSWORD" || { echo "Missing secret: MONETA_ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore Android signing keystore
        env:
          MONETA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MONETA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/moneta-signing"
          printf '%s' "$MONETA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moneta-signing/moneta-release.jks"
          chmod 600 "$RUNNER_TEMP/moneta-signing/moneta-release.jks"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Configure Android release signing and version
        env:
          MONETA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/moneta-signing/moneta-release.jks
          MONETA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          MONETA_ANDROID_KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          MONETA_ANDROID_KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
          MONETA_APP_VERSION: ${{ steps.version.outputs.app_version }}
          MONETA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode 1', f'versionCode {os.environ["MONETA_VERSION_CODE"]}')
          text = text.replace('versionName "1.0"', f'versionName "{os.environ["MONETA_APP_VERSION"]}"')

          marker = '    buildTypes {'
          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("MONETA_ANDROID_KEYSTORE_PATH"))
                  storePassword System.getenv("MONETA_ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("MONETA_ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("MONETA_ANDROID_KEY_PASSWORD")
              }
          }\n'''
          if marker not in text:
              raise SystemExit('Could not locate buildTypes block in generated Android project')
          text = text.replace(marker, signing + marker, 1)

          release_marker = '        release {'
          if release_marker not in text:
              raise SystemExit('Could not locate release build type in generated Android project')
          text = text.replace(release_marker, release_marker + '\n            signingConfig signingConfigs.release', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Enable Android biometric permission
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.USE_BIOMETRIC" />'
          if permission not in text:
              manifest_start = text.find('<manifest')
              manifest_open_end = text.find('>', manifest_start) + 1
              text = text[:manifest_open_end] + '\n    ' + permission + text[manifest_open_end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Moneta launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          base="android/app/src/main/res"
          for spec in "mipmap-mdpi:48:108" "mipmap-hdpi:72:162" "mipmap-xhdpi:96:216" "mipmap-xxhdpi:144:324" "mipmap-xxxhdpi:192:432"; do
            IFS=: read -r folder launcher foreground <<< "$spec"
            mkdir -p "$base/$folder"
            rsvg-convert -w "$launcher" -h "$launcher" assets/icons/icon-android-launcher.svg -o "$base/$folder/ic_launcher.png"
            cp "$base/$folder/ic_launcher.png" "$base/$folder/ic_launcher_round.png"
            rsvg-convert -w "$foreground" -h "$foreground" assets/icons/icon-android-foreground.svg -o "$base/$folder/ic_launcher_foreground.png"
          done
          cat > "$base/values/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#214B3B</color></resources>
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          MONETA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/moneta-signing/moneta-release.jks
          MONETA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MONETA_ANDROID_KEYSTORE_PASSWORD }}
          MONETA_ANDROID_KEY_ALIAS: ${{ secrets.MONETA_ANDROID_KEY_ALIAS }}
          MONETA_ANDROID_KEY_PASSWORD: ${{ secrets.MONETA_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK file
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"

      - name: Upload test artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: moneta-${{ steps.version.outputs.app_version }}-signed-release
          path: ${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.apk_name }}" \
            --title "Moneta ${{ steps.version.outputs.app_version }}" \
            --generate-notes
